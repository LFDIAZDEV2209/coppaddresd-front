name: Deploy Frontend

on:
  push:
    branches: [dev]
    paths:
      - "**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 933629770820.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: cooppadresd-frontend
  ECS_CLUSTER: cooppadresd-cluster
  ECS_SERVICE: cooppadresd-frontend
  NEXT_PUBLIC_GATEWAY_URL: https://erp.coppadresd.com
  NEXT_PUBLIC_COMMUNITY_API_URL: https://erp.coppadresd.com/api/v1/community
  NEXT_PUBLIC_APPLICATION_CODE: erp
  NEXT_PUBLIC_SESSION_IDLE_MINUTES: "30"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack ANTES de setup-node: el cache de yarn ejecuta yarn cache dir
      # y con Yarn 1 global falla por packageManager (yarn@4.18.0).
      - name: Activar Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"

      - name: Instalar dependencias
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_GATEWAY_URL: ${{ env.NEXT_PUBLIC_GATEWAY_URL }}
          NEXT_PUBLIC_COMMUNITY_API_URL: ${{ env.NEXT_PUBLIC_COMMUNITY_API_URL }}
          NEXT_PUBLIC_APPLICATION_CODE: ${{ env.NEXT_PUBLIC_APPLICATION_CODE }}
          NEXT_PUBLIC_SESSION_IDLE_MINUTES: ${{ env.NEXT_PUBLIC_SESSION_IDLE_MINUTES }}

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::933629770820:role/cooppadresd-gha-frontend
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # Caché GHA: el Dockerfile ya separa deps/builder/runner; pushes de
      # solo-código reutilizan node_modules y el build baja a ~1-3 min.
      # push:false + docker push clasico: buildx resolviendo el tag exige
      # ecr:BatchGetImage y el rol GHA no lo tiene; el push clasico si funciona.
      - name: Build imagen (${{ github.sha }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            NEXT_PUBLIC_GATEWAY_URL=${{ env.NEXT_PUBLIC_GATEWAY_URL }}
            NEXT_PUBLIC_COMMUNITY_API_URL=${{ env.NEXT_PUBLIC_COMMUNITY_API_URL }}
            NEXT_PUBLIC_APPLICATION_CODE=${{ env.NEXT_PUBLIC_APPLICATION_CODE }}
            NEXT_PUBLIC_SESSION_IDLE_MINUTES=${{ env.NEXT_PUBLIC_SESSION_IDLE_MINUTES }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Push ECR (docker push clasico)
        run: |
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Registrar nueva Task Definition (imagen SHA)
        id: taskdef
        shell: bash
        run: |
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "${{ env.ECS_SERVICE }}" --region "${{ env.AWS_REGION }}" --query "taskDefinition" --output json)
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          NEW_TASK_DEF_JSON=$(echo "$TASK_DEF_JSON" | jq --arg img "$NEW_IMAGE" '
            .containerDefinitions[0].image = $img |
            del(.status, .compatibilities, .taskDefinitionArn, .revision, .registeredAt, .registeredBy, .requiresAttributes)
          ')
          REGISTERED=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF_JSON" --region "${{ env.AWS_REGION }}")
          echo "arn=$(echo "$REGISTERED" | jq -r '.taskDefinition.taskDefinitionArn')" >> "$GITHUB_OUTPUT"

      - name: Actualizar ECS Service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Esperar rollout COMPLETED (polling 15s)
        timeout-minutes: 20
        shell: bash
        run: |
          SERVICE="${{ env.ECS_SERVICE }}"
          TD_ARN="${{ steps.taskdef.outputs.arn }}"
          DEADLINE=$((SECONDS + 1200))

          while true; do
            DEP=$(aws ecs describe-services \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query "services[0].deployments[?taskDefinition=='$TD_ARN'] | [0]" \
              --output json)

            STATE=$(echo "$DEP" | jq -r '.rolloutState // "MISSING"')
            RUNNING=$(echo "$DEP" | jq -r '.runningCount // "?"')
            DESIRED=$(echo "$DEP" | jq -r '.desiredCount // "?"')

            echo "[$(date -u +%H:%M:%S)] rollout=$STATE running=$RUNNING desired=$DESIRED"

            if [ "$STATE" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ]; then
              echo "Deployment estable: rollout=$STATE running=$RUNNING desired=$DESIRED"
              exit 0
            fi

            if [ "$STATE" = "FAILED" ]; then
              echo "::error::Rollout FAILED: el deployment de $SERVICE no pudo completarse"
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timeout 20 min: rollout=$STATE running=$RUNNING desired=$DESIRED"
              exit 1
            fi

            sleep 15
          done

      - name: Diagnóstico en fallo
        if: failure()
        shell: bash
        run: |
          TASKS=$(aws ecs list-tasks \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service-name "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}" --query "taskArns" --output text)
          for T in $TASKS; do
            aws ecs describe-tasks \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --tasks "$T" --region "${{ env.AWS_REGION }}" \
              --query "tasks[0].{Status:lastStatus,Stop:stoppedReason,Containers:containers[*].{Name:name,Exit:exitCode,Reason:reason}}" \
              --output json
          done
          # re-register
